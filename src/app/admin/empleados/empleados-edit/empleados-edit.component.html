<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-body">

                <div class="d-md-flex align-items-center">
                    <div>
                        <h4 class="card-title">Editar empleado</h4>
                        <p class="card-subtitle">
                            Form para editar empleado
                        </p>
                    </div>
                </div>

                <div *ngIf="loading" class="text-center py-4">
                    <div class="spinner-border text-primary"></div>
                </div>

                <div *ngIf="error" class="alert alert-danger">
                    {{ error }}
                </div>

                <div *ngIf="empleado">

                    <form (ngSubmit)="saveEmpleado()" #form="ngForm">

                        <div class="row">

                            <!-- Nombre -->
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text" class="form-control" [(ngModel)]="empleado.first_name"
                                    name="first_name" required>
                            </div>

                            <!-- Apellido -->
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Apellido</label>
                                <input type="text" class="form-control" [(ngModel)]="empleado.last_name"
                                    name="last_name" required>
                            </div>

                            <!-- Email -->
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" [(ngModel)]="empleado.email" name="email">
                            </div>

                            <!-- Teléfono -->
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Teléfono</label>
                                <input type="text" class="form-control" [(ngModel)]="empleado.phone" name="phone">
                            </div>

                        </div>

                        <!-- Botones -->
                        <div class="d-flex justify-content-end gap-2 mt-3">

                            <button type="button" class="btn btn-outline-secondary" (click)="cancelar()">
                                Cancelar
                            </button>

                            <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
                                Guardar Cambios
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>
</div>
