<div class="usuarios-container container mt-4">

  <h2 class="mb-4">Usuarios</h2>

  <!-- Botón para abrir modal de creación -->
  <button type="button" class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#createUsuarioModal">
    + Nuevo Usuario
  </button>

  <!-- Modal Crear Usuario -->
  <div class="modal fade" id="createUsuarioModal" tabindex="-1" aria-labelledby="createUsuarioModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title" id="createUsuarioModalLabel">Crear Nuevo Usuario</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>

        <div class="modal-body">
          <form>
            <div class="mb-3">
              <label for="username" class="form-label">Usuario</label>
              <input type="text" id="username" [(ngModel)]="newUsuario.username" name="username" class="form-control" placeholder="Nombre de usuario">
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Correo Electrónico</label>
              <input type="email" id="email" [(ngModel)]="newUsuario.email" name="email" class="form-control" placeholder="Email">
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Contraseña</label>
              <input type="password" id="password" [(ngModel)]="newUsuario.password" name="password" class="form-control" placeholder="Contraseña">
            </div>
          </form>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" (click)="createUsuario()" data-bs-dismiss="modal">Crear</button>
        </div>

      </div>
    </div>
  </div>

  <!-- Tabla de usuarios -->
  <table class="table table-striped table-bordered">
    <thead class="table-dark">
      <tr>
        <th>Usuario</th>
        <th>Email</th>
        <th>Activo</th>
        <th>Fecha de Registro</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let u of usuarios">

        <!-- Usuario -->
        <td *ngIf="editingUsuario?.id !== u.id">{{ u.username }}</td>
        <td *ngIf="editingUsuario?.id === u.id">
          <input [(ngModel)]="editingUsuario!.username" class="form-control form-control-sm">
        </td>

        <!-- Email -->
        <td *ngIf="editingUsuario?.id !== u.id">{{ u.email }}</td>
        <td *ngIf="editingUsuario?.id === u.id">
          <input [(ngModel)]="editingUsuario!.email" class="form-control form-control-sm">
        </td>

        <!-- Estado -->
        <td>
          <span [ngClass]="u.isActive ? 'badge bg-success' : 'badge bg-secondary'">
            {{ u.isActive ? 'Activo' : 'Inactivo' }}
          </span>
        </td>

        <!-- Fecha -->
        <td>{{ u.createdAt | date:'short' }}</td>

        <!-- Acciones -->
        <td>
          <button *ngIf="editingUsuario?.id !== u.id" class="btn btn-sm btn-warning me-1" (click)="editUsuario(u)">Editar</button>
          <button *ngIf="editingUsuario?.id === u.id" class="btn btn-sm btn-success me-1" (click)="updateUsuario()">Guardar</button>
          <button *ngIf="editingUsuario?.id === u.id" class="btn btn-sm btn-secondary me-1" (click)="cancelEdit()">Cancelar</button>
          <button class="btn btn-sm btn-danger" (click)="deleteUsuario(u)">Eliminar</button>
        </td>

      </tr>
    </tbody>
  </table>

</div>
